<svg xmlns="http://www.w3.org/2000/svg" width="600" height="132" viewBox="0 0 600 132" role="img" aria-label="Shounak Joshi">
  <style>
  .m-bg   { fill: #faf9f5; }
  .m-ink  { fill: #1a1815; }
  .m-mut  { fill: #6c6a64; }
  .m-acc  { fill: #b4533a; }
  .m-hair { fill: #e4e1d9; }
  .m-line { stroke: #e4e1d9; stroke-width: 1; }
  @media (prefers-color-scheme: dark) {
    .m-bg   { fill: #14120f; }
    .m-ink  { fill: #f0ece4; }
    .m-mut  { fill: #a19b8f; }
    .m-acc  { fill: #e8946f; }
    .m-hair { fill: #2e2924; }
    .m-line { stroke: #2e2924; }
  }

  @keyframes cycle {
    0%   { opacity: 0; }
    2%   { opacity: 1; }
    18%  { opacity: 1; }
    20%  { opacity: 0; }
    100% { opacity: 0; }
  }
  @keyframes blink { 0%, 49% { opacity: 1 } 50%, 100% { opacity: 0 } }
  @keyframes sweep { from { transform: translateX(0) } to { transform: translateX(1040px) } }

  .m-l0 { animation: cycle 10s linear infinite; }
  .m-l1 { animation: cycle 10s linear infinite; animation-delay: -8s; }
  .m-l2 { animation: cycle 10s linear infinite; animation-delay: -6s; }
  .m-l3 { animation: cycle 10s linear infinite; animation-delay: -4s; }
  .m-l4 { animation: cycle 10s linear infinite; animation-delay: -2s; }
  .caret { animation: blink 1.1s step-end infinite; }
  .sweep { animation: sweep 10s cubic-bezier(.45, 0, .2, 1) infinite; }

  /* Honour the OS reduced-motion setting: everything holds a readable state. */
  @media (prefers-reduced-motion: reduce) {
    .m-l0, .m-l1, .m-l2, .m-l3, .m-l4,
    .caret, .sweep { animation: none; }
    .m-l1, .m-l2, .m-l3, .m-l4 { display: none; }
  }</style>
  <rect class="m-bg m-line" x="0.5" y="0.5" width="599" height="131" rx="10"/>
  <g class="sweep">
    <rect x="-220" y="72" width="220" height="2.5" rx="1.25" class="m-acc"/>
  </g>
  <rect class="m-hair" x="24" y="72" width="552" height="2.5" rx="1.25"/>
  <text class="m-ink" x="24" y="52" font-family="ui-serif, Georgia, 'Iowan Old Style', 'Times New Roman', serif" font-size="36" font-weight="600" letter-spacing="0.3">Shounak Joshi</text>
  <text class="m-mut" x="24" y="91" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="1.8">BUILDING</text>
    <g class="m-l0">
      <text class="m-ink" x="24" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">~/flux — agentic AI over Bun, React 19, pgvector, E2B sandboxes<tspan class="m-acc caret">&#9608;</tspan></text>
    </g>
    <g class="m-l1">
      <text class="m-ink" x="24" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">~/de-ai — deterministic text rewriter, zero LLM calls<tspan class="m-acc caret">&#9608;</tspan></text>
    </g>
    <g class="m-l2">
      <text class="m-ink" x="24" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">~/stellar-forge — real-time events, Three.js, WebSocket + SSE<tspan class="m-acc caret">&#9608;</tspan></text>
    </g>
    <g class="m-l3">
      <text class="m-ink" x="24" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">~/voxelcraft — C# voxel engine in Godot 4.7, greedy meshing + baked AO<tspan class="m-acc caret">&#9608;</tspan></text>
    </g>
    <g class="m-l4">
      <text class="m-ink" x="24" y="106" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="13">~/raksha — predictive crowd safety, Hackathon 2026<tspan class="m-acc caret">&#9608;</tspan></text>
    </g>
</svg>

<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-label="Building things that hold up when someone else runs them">
  <style>
    .ink { fill: #1a1815; }
    .mut { fill: #6c6a64; }
    .hair { stroke: #e3e0d8; }
    .skin { fill: #b4533a; opacity: .30; }
    .fin { fill: #b4533a; opacity: .21; }
    .eye { fill: #1a1815; opacity: .55; }

    /* Two slow motions. The head sways about the neck hinge and breathes about
       the skull; it never slides across the panel, because a head drifting
       sideways reads as a sticker rather than an animal. */
    @keyframes sway {
      0%, 100% { transform: rotate(-1.2deg); }
      50%      { transform: rotate(1.4deg); }
    }
    @keyframes breath {
      0%, 100% { transform: scale(1); }
      50%      { transform: scale(1.025); }
    }
    @keyframes settle {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    @supports (animation-name: sway) {
      .sway { animation: sway 7s ease-in-out infinite; transform-origin: 620px 320px; }
      .breath { animation: breath 4.6s ease-in-out infinite; transform-origin: 470px 110px; }
      .t0 { animation: settle .9s cubic-bezier(.16,1,.3,1) both; }
      .t1 { animation: settle .9s cubic-bezier(.16,1,.3,1) .12s both; }
      .t2 { animation: settle .9s cubic-bezier(.16,1,.3,1) .24s both; }
    }

    @media (prefers-reduced-motion: reduce) {
      .sway, .breath { animation: none; }
      .t0, .t1, .t2 { animation: none; opacity: 1; }
    }

    @media (prefers-color-scheme: dark) {
      .ink { fill: #f0ece4; }
      .mut { fill: #a19b8f; }
      .hair { stroke: #2b2723; }
      .skin { fill: #e8946f; opacity: .23; }
      .fin { fill: #e8946f; opacity: .16; }
      .eye { fill: #f0ece4; opacity: .45; }
    }
  </style>

  <!-- dragon first, words painted over it -->
  <g class="sway">
    <path class="skin" d="M 599 145 C 648 190 690 250 712 320 L 630 320 C 620 266 598 210 574 172 Z"/>
    <g class="breath">
      <path class="skin" d="M 400 98 C 420 91 452 87 478 85 C 493 73 513 73 527 86 C 557 92 581 113 593 139 L 604 157 L 572 151 L 557 147 L 551 160 L 543 147 L 527 144 L 521 157 L 513 144 L 497 141 L 491 154 L 483 141 L 467 138 L 461 151 L 453 138 L 437 134 L 431 147 L 423 134 L 411 114 C 405 109 400 105 400 98 Z"/>
      <path class="fin" d="M 540 88 C 566 60 597 42 631 32 C 605 60 581 80 567 99 Z"/>
      <path class="fin" d="M 549 104 C 578 90 612 85 645 85 C 616 103 590 117 570 121 Z"/>
      <path class="fin" d="M 597 141 L 630 116 L 609 159 Z"/>
      <circle cx="486" cy="104" r="3.4" class="eye"/>
    </g>
  </g>

  <text class="ink t0" x="0" y="104" font-family="ui-serif, Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="33" font-weight="600">Building things that hold up</text>
  <text class="ink t1" x="0" y="146" font-family="ui-serif, Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="33" font-weight="600">when someone else runs them.</text>
  <line class="hair t2" x1="0" y1="266" x2="112" y2="266" stroke-width="1.5"/>
  <text class="mut t2" x="126" y="270" font-family="ui-serif, Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="14">Second year in Nagpur. TypeScript, Python, C#, and a lot of reading.</text>
</svg>

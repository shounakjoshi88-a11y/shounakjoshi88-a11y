<svg xmlns="http://www.w3.org/2000/svg" width="680" height="388" viewBox="0 0 680 388" role="img" aria-label="Selected work index: Flux, Stellar Forge, de-ai, Meridian">
  <style>
  .ink   { fill: #1a1815; }
  .mut   { fill: #6c6a64; }
  .fnt   { fill: #a8a49c; }
  .acc   { fill: #b4533a; }
  .accs  { stroke: #b4533a; }
  .hair  { stroke: #e3e0d8; }
  .sheenstop { stop-color: #b4533a; }
  .pulse { fill: #b4533a; }
  @media (prefers-color-scheme: dark) {
    .ink   { fill: #f0ece4; }
    .mut   { fill: #a19b8f; }
    .fnt   { fill: #6b655c; }
    .acc   { fill: #e8946f; }
    .accs  { stroke: #e8946f; }
    .hair  { stroke: #2b2723; }
    .sheenstop { stop-color: #e8946f; }
    .pulse { fill: #e8946f; }
  }
  @keyframes settle {
    from { opacity: 0; transform: translateY(9px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  @keyframes draw { to { stroke-dashoffset: 0; } }
  /* One glint, then stillness. A continuous loop reads as a light show; a
     3s pass every 13s reads as a considered detail. */
  @keyframes sheen {
    0%   { transform: translateX(0); }
    21%  { transform: translateX(1180px); }
    100% { transform: translateX(1180px); }
  }
  @keyframes breathe { 0%, 100% { opacity: .3; } 50% { opacity: .9; } }

  /* An SVG loaded through an image tag exposes no pointer events, so there is
     deliberately no hover rule anywhere in this file. Angle brackets are kept
     out of these comments: XML would parse them as markup. */

  @supports (animation-name: settle) {
    
    .s0 { animation: settle .8s cubic-bezier(.16,1,.3,1) both; }
    .s1 { animation: settle .8s cubic-bezier(.16,1,.3,1) .07s both; }
    .s2 { animation: settle .8s cubic-bezier(.16,1,.3,1) .14s both; }
    .s3 { animation: settle .8s cubic-bezier(.16,1,.3,1) .21s both; }
        .d0 { stroke-width: 1; stroke-dasharray: 628; stroke-dashoffset: 628;
            animation: draw 1.2s cubic-bezier(.16,1,.3,1) 0.34s forwards; }
    .d1 { stroke-width: 1; stroke-dasharray: 628; stroke-dashoffset: 628;
            animation: draw 1.2s cubic-bezier(.16,1,.3,1) 0.44s forwards; }
    .d2 { stroke-width: 1; stroke-dasharray: 628; stroke-dashoffset: 628;
            animation: draw 1.2s cubic-bezier(.16,1,.3,1) 0.54s forwards; }
    .d3 { stroke-width: 1; stroke-dasharray: 628; stroke-dashoffset: 628;
            animation: draw 1.2s cubic-bezier(.16,1,.3,1) 0.64s forwards; }
    .d4 { stroke-width: 1; stroke-dasharray: 680; stroke-dashoffset: 680;
            animation: draw 1.2s cubic-bezier(.16,1,.3,1) .74s forwards; }
    
    
  }

  @media (prefers-reduced-motion: reduce) {
    .s0, .s1, .s2, .s3, .s4, .s5 { animation: none; opacity: 1; transform: none; }
    .d0, .d1, .d2, .d3, .d4 { animation: none; stroke-dashoffset: 0; }
    .sheen { animation: none; opacity: 0; }
    .pulse { animation: none; opacity: .65; }
  }
</style>

  <text class="mut s0" x="0" y="12" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="2.6">SELECTED WORK</text>
  <text class="fnt s1" x="680" y="12" text-anchor="end" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="10.5" letter-spacing="1.6">2024 &#8212; 2026</text>
  <line class="hair d4" x1="0" y1="30" x2="680" y2="30"/>

  <g class="s3">
    <text class="fnt" x="0" y="65" font-family="ui-serif, Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="30" font-weight="600">01</text>
    <text class="ink" x="52" y="62" font-family="ui-serif, Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="19" font-weight="600">Flux</text>
    <text class="mut" x="52" y="85" font-family="ui-serif, Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="14">Agentic AI companion. Plans, executes under tool permissions, verifies, retries.</text>
    <text class="fnt" x="52" y="104" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="0.2">Bun · React 19 · pgvector · E2B · NVIDIA NIM</text>
  </g>
  <line class="hair d0" x1="52" y1="118" x2="680" y2="118"/>
  <g class="s3">
    <text class="fnt" x="0" y="143" font-family="ui-serif, Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="30" font-weight="600">02</text>
    <text class="ink" x="52" y="140" font-family="ui-serif, Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="19" font-weight="600">Stellar Forge</text>
    <text class="mut" x="52" y="163" font-family="ui-serif, Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="14">Event platform whose ticket is cut by a scroll-driven pair of 3D scissors.</text>
    <text class="fnt" x="52" y="182" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="0.2">React · Three.js · GSAP · Prisma · WebSocket</text>
  </g>
  <line class="hair d1" x1="52" y1="196" x2="680" y2="196"/>
  <g class="s3">
    <text class="fnt" x="0" y="221" font-family="ui-serif, Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="30" font-weight="600">03</text>
    <text class="ink" x="52" y="218" font-family="ui-serif, Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="19" font-weight="600">de-ai</text>
    <text class="mut" x="52" y="241" font-family="ui-serif, Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="14">A text rewriter that calls no model at all. 156 assertions pin the behaviour.</text>
    <text class="fnt" x="52" y="260" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="0.2">Python · FastAPI · regex rule bank</text>
  </g>
  <line class="hair d2" x1="52" y1="274" x2="680" y2="274"/>
  <g class="s3">
    <text class="fnt" x="0" y="299" font-family="ui-serif, Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="30" font-weight="600">04</text>
    <text class="ink" x="52" y="296" font-family="ui-serif, Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="19" font-weight="600">Meridian</text>
    <text class="mut" x="52" y="319" font-family="ui-serif, Georgia, 'Iowan Old Style', 'Palatino Linotype', 'Times New Roman', serif" font-size="14">Clinical triage built only from six lab practicals, on real ICD-10-CM data.</text>
    <text class="fnt" x="52" y="338" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="0.2">Python · Flask · pandas · matplotlib</text>
  </g>
  <line class="hair d3" x1="52" y1="352" x2="680" y2="352"/>
  <line class="hair d4" x1="0" y1="380" x2="680" y2="380"/>
</svg>
